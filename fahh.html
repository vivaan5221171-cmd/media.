<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my hobby cards</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            padding:30px 15px
        }

        h1 {
            text-align: center;
            color: green;
        }

        .hobby-card{
            text-align: center;
            border: 2px solid rgb(172, 127, 44)
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff;
        }

        .hobby-card h3 {
            color: #007bff;
        }
        </style>
</head>
<body>
    
    <h1>my hobby cards</h1>


    <div class="container">

        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>gaming</h3>
                    <p>love gaming on roblox</p>
                    </div>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="hobby-card">
                            <h3>drinking monster energy</h3>
                            <p>my favourite flavour is monster energy nitro.</p>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="hobby-card">
                            <h3>bursting crackers</h3>
                            <p>enjoy bursting crackers.</p>
                        </div>
                    </div>

                    </div>
    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>

</body>

</html>

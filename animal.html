<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my animal fact file</title>
    <style>
        body {
            background-color: aliceblue;
            font-family: Arial, Helvetica, sans-serif;                        
        }


        .fact-file {
            background-color: aquamarine;
            color: blue;
            width: 260px;
            padding: 25px;
            border: 4px solid forestgreen;
            margin: 30px;
        }

        .animal-name {
            color: yellow;
            font-size: 24px;
        }

        .detail {
            color: azure;
        }

        .cool-fact {
            color: beige;
            font-style: italic;
        }
    </style>
</head>
<body>
    
    <div class="fact-file">
        <h2 class="animal-name">snow leopard</h2>
        <p class="detail">Big Cat</p>
        <p class="detail">lives in:mountains and snowy areas</p>
        <p class="detail">diet:goats,deer and wild sheep</p>
        <p class="cool-fact">cool fact:can leap upto 15 metres in one jump</p>
    </div>

</body>

</html>

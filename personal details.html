<!DOCTYPE html>
<html>

<head>

    <title>my doctors appointment</title>
</head>

<body>
    
    <h1>my doctors appointment</h1>
    <p>fill in the form to book your appointment!</p>
    <hr>

<form>

    <fieldset>
        <legend>personal details</legend>

        <label>your name</label><br>
        <input type="text" id="name" placeholder="enter your full name"><br></fieldset>br>

        <label for="patient id"></label><br>
        <input type="password" id="pid" placeholder="your secret id"><br><br>

        <label for="date of birth"></label><br>
        <input type="date" id="dob">

    </fieldset>

    <br>
     <fieldset>
        <legend>your visit</legend>

        <label for="choose your doctor"></label>
        <select id="doctor"></select>

        <label>choose your doctor</label>
        <select id="doctor">
            <option value="">--select a doctor--</option>
            <option value="dr ray">dr ray-general</option>
            <option value="dr chad">dr chad-neurosurgeon</option>
            <option value="dr john">dr john-dentist</option>
            <select><br><br>

                <label>why are visiting</label>
                <input type="radio" name="reason" value="fever">fever<br>
                <input type="radio" name="reason" value="cold">cold<br>
                <input type="radio" name="reason" value="anaemia">anaemia<br>

                <label>any notes for the doctor</label>
                <textarea id="notes" rows="3" column="35"</textarea>
                <placeholder="eg i have sore throat for about three sexavigintillion weeks">

                </fieldset>

                <br>

                <fieldset>
                    <legend>preferred visit day</legend>

                    <input type="checkbox" value="monday"><br>
                    <input type="checkbox" value="thursday"><br>
                    <input type="checkbox" value="saturday"><br>

                </fieldset>

                <input type="submit" value="book my appointment"

</form>
    
</body>

</html>

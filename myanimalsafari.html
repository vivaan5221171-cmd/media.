<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animal safari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {

            background: lightyellow;

        }

        .slide {

            height: 200px;

            text-align: center;

            padding-top: 70px;

            color: white;

            font-size: 25px;

        }

        .forest {

            background: green;

        }

        .ocean {

            background: blue;

        }

        .desert {

            background: orange;

        }

        .section {

            padding: 20px;

            margin: 10px;

        }
    </style>

</head>

<body>

    <div id="safari" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">
            <div clas="carousel-item active">
                <div class="slide-forest">🌲 forest safari</div>
            </div>

            <div class="carousel-item">
                <div class="slide-ocean">🐳 ocean safari</div>
            </div>

            <div class="carousel-item">
                <div class="slide-desert">🐪 desert safari safari</div>
            </div>
        </div>

        <button class="carousel-control-prev" data-bs-target="#safari" data-bs-slide="next">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next-icon">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <nav clas="navbar-navbar-expand navbar bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">safari guide</a>

            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#forest">forest</a></li>
                <li class="nav-item"><a class="nav-link" href="#ocean">ocean</a></li>
                <li class="nav-item"><a class="nav-link" href="#desert">desert</a></li>

                <li class="nav-item"><a class="nav-link" href="#desert">Desert</a></li>

            </ul>

        </div>

    </nav>

    <!-- Animal Sections -->

    <div class="container">

        <div id="forest" class="section forest text-white">

            <h3>🌳 Forest Safari</h3>

            <p>Discover tigers, elephants and monkeys.</p>

        </div>

        <div id="ocean" class="section ocean text-white">

            <h3>🐬 Ocean Safari</h3>

            <p>Explore dolphins, sharks and colourful fish.</p>

        </div>

        <div id="desert" class="section desert text-white">

            <h3>🐪 Desert Safari</h3>

            <p>Discover camels, lizards and desert foxes.</p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

</body>

</html>
